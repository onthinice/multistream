<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MultiStream</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #0a0a0a;
  --surface: #141414;
  --surface2: #1c1c1c;
  --border: #242424;
  --accent: #7c3aed;
  --accent2: #a78bfa;
  --text: #e5e5e5;
  --muted: #555;
  --twitch: #9146ff;
  --kick: #53fc18;
  --youtube: #ff0000;
  --tiktok: #ff0050;
  --fav-panel: 240px;
}

html, body {
  height: 100%;
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  font-size: 14px;
  overflow: hidden;
}

/* ══ TOP BAR ══ */
#topbar {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 0 10px;
  height: 44px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
  overflow-x: auto;
  overflow-y: hidden;
  position: relative;
  z-index: 10;
}
#topbar::-webkit-scrollbar { height: 3px; }
#topbar::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

.logo {
  font-weight: 800;
  font-size: 15px;
  letter-spacing: -0.5px;
  color: var(--accent2);
  white-space: nowrap;
  flex-shrink: 0;
  margin-right: 2px;
}

#pill-container { display: flex; gap: 6px; align-items: center; }

.stream-pill {
  display: flex;
  align-items: center;
  gap: 5px;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 3px 7px 3px 6px;
  white-space: nowrap;
  flex-shrink: 0;
  font-size: 12px;
}
.stream-pill .pdot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
.stream-pill .prm {
  background: none; border: none; color: var(--muted);
  cursor: pointer; font-size: 13px; line-height: 1; padding: 0 0 0 3px;
  transition: color .15s;
}
.stream-pill .prm:hover { color: #ff4444; }

.tb-btn {
  background: var(--surface2);
  border: 1px solid var(--border);
  color: var(--text);
  border-radius: 4px;
  padding: 5px 10px;
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  white-space: nowrap;
  flex-shrink: 0;
  transition: border-color .15s, background .15s;
}
.tb-btn:hover { border-color: var(--accent); }
.tb-btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.tb-btn.primary:hover { background: #6d28d9; border-color: #6d28d9; }
.tb-btn.fav-toggle { gap: 5px; display: flex; align-items: center; }
.tb-btn.fav-toggle.active { border-color: #f59e0b; color: #f59e0b; }

/* ══ BODY LAYOUT ══ */
#body {
  display: flex;
  height: calc(100vh - 44px);
}

/* ══ FAV PANEL ══ */
#fav-panel {
  width: var(--fav-panel);
  flex-shrink: 0;
  background: var(--surface);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  overflow: hidden;
  transition: width .2s ease, opacity .2s;
}
#fav-panel.hidden { width: 0; opacity: 0; pointer-events: none; }

.fav-header {
  padding: 10px 12px 8px;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
.fav-header h3 { font-size: 12px; font-weight: 700; color: var(--muted); letter-spacing: .5px; text-transform: uppercase; }

.fav-list {
  overflow-y: auto;
  flex: 1;
  padding: 6px 0;
}
.fav-list::-webkit-scrollbar { width: 4px; }
.fav-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

.fav-item {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 7px 12px;
  cursor: pointer;
  transition: background .1s;
  position: relative;
}
.fav-item:hover { background: var(--surface2); }
.fav-item .pdot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
.fav-item .fav-name { font-size: 13px; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.fav-item .fav-platform { font-size: 10px; color: var(--muted); }
.fav-item .fav-actions { display: flex; gap: 4px; opacity: 0; transition: opacity .15s; }
.fav-item:hover .fav-actions { opacity: 1; }
.fav-item .fav-play {
  background: var(--accent); border: none; color: #fff;
  border-radius: 3px; padding: 2px 7px; font-size: 11px; font-weight: 600; cursor: pointer;
}
.fav-item .fav-del {
  background: none; border: none; color: var(--muted);
  cursor: pointer; font-size: 13px; padding: 0 2px; transition: color .15s;
}
.fav-item .fav-del:hover { color: #ff4444; }

.fav-empty {
  padding: 20px 12px;
  color: var(--muted);
  font-size: 12px;
  text-align: center;
  line-height: 1.6;
}

/* group labels */
.fav-group-label {
  padding: 8px 12px 3px;
  font-size: 10px;
  font-weight: 700;
  color: var(--muted);
  letter-spacing: .4px;
  text-transform: uppercase;
}

/* ══ GRID ══ */
#grid {
  display: grid;
  flex: 1;
  gap: 2px;
  background: #000;
  min-width: 0;
}

.stream-cell {
  background: #0a0a0a;
  overflow: hidden;
  display: flex;
  flex-direction: column;
}
/* iframe fills everything below the bar — never obscured by controls */
.stream-cell iframe {
  flex: 1;
  min-height: 0;
  width: 100%;
  border: none;
  display: block;
}

/* slim always-visible bar above each iframe — keeps controls out of stream area */
.cell-bar {
  display: flex;
  align-items: center;
  gap: 4px;
  padding: 0 5px;
  background: #0f0f0f;
  border-bottom: 1px solid #1c1c1c;
  height: 26px;
  flex-shrink: 0;
  overflow: hidden;
  min-width: 0;
}
.cell-bar .bar-dot {
  width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0;
}
.cell-bar .bar-name {
  font-size: 11px; font-weight: 600; color: #aaa;
  flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  min-width: 0;
}
.cell-btn {
  width: 22px; height: 22px;
  border-radius: 4px;
  border: none;
  cursor: pointer;
  font-size: 13px;
  line-height: 1;
  display: flex; align-items: center; justify-content: center;
  transition: background .12s;
  background: transparent;
  flex-shrink: 0;
  padding: 0;
}
.cell-btn:hover { background: rgba(255,255,255,0.09); }
.cell-btn.close-btn { color: #666; }
.cell-btn.close-btn:hover { background: rgba(200,30,30,0.75); color: #fff; }
.cell-btn.heart-btn { color: #555; }
.cell-btn.heart-btn.faved { color: #f87171; }
.cell-btn.heart-btn:hover { color: #f87171; background: rgba(248,113,113,0.15); }

/* ══ MODAL ══ */
#modal-overlay {
  display: none;
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.8);
  z-index: 200;
  align-items: center;
  justify-content: center;
}
#modal-overlay.open { display: flex; }

#modal {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 22px 24px 20px;
  width: 370px;
  max-width: 96vw;
}
#modal h2 { font-size: 15px; font-weight: 700; margin-bottom: 5px; }
#modal .sub { color: var(--muted); font-size: 12px; margin-bottom: 14px; line-height: 1.5; }

.platform-tabs { display: flex; gap: 6px; margin-bottom: 12px; flex-wrap: wrap; }
.ptab {
  padding: 5px 12px; border-radius: 4px; border: 1px solid var(--border);
  background: var(--bg); color: var(--muted);
  cursor: pointer; font-size: 12px; font-weight: 600; transition: all .15s;
}
.ptab.active { color: #fff; border-color: transparent; }
.ptab[data-p="twitch"].active  { background: var(--twitch); }
.ptab[data-p="kick"].active    { background: #29880c; }
.ptab[data-p="youtube"].active { background: var(--youtube); }
.ptab[data-p="tiktok"].active  { background: var(--tiktok); }

/* input + dropdown wrapper */
.input-wrap { position: relative; margin-bottom: 6px; }
#stream-input {
  width: 100%; background: var(--bg); border: 1px solid var(--border);
  color: var(--text); border-radius: 4px; padding: 9px 12px;
  font-size: 14px; outline: none; transition: border-color .15s;
}
#stream-input:focus { border-color: var(--accent); }

/* autocomplete dropdown */
#autocomplete {
  display: none;
  position: absolute;
  top: 100%; left: 0; right: 0;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-top: none;
  border-radius: 0 0 5px 5px;
  z-index: 300;
  max-height: 160px;
  overflow-y: auto;
}
#autocomplete.show { display: block; }
#autocomplete::-webkit-scrollbar { width: 4px; }
#autocomplete::-webkit-scrollbar-thumb { background: var(--border); }
.ac-item {
  display: flex; align-items: center; gap: 8px;
  padding: 8px 12px; cursor: pointer; font-size: 13px;
  transition: background .1s;
}
.ac-item:hover, .ac-item.selected { background: var(--accent); color: #fff; }
.ac-item:hover .ac-plat, .ac-item.selected .ac-plat { color: rgba(255,255,255,.6); }
.ac-plat { font-size: 10px; color: var(--muted); margin-left: auto; }

#input-hint { font-size: 11px; color: var(--muted); margin-bottom: 14px; min-height: 15px; }

.modal-actions { display: flex; gap: 8px; justify-content: flex-end; }
.btn-cancel {
  background: none; border: 1px solid var(--border); color: var(--muted);
  border-radius: 4px; padding: 7px 15px; font-size: 13px; cursor: pointer;
}
.btn-cancel:hover { color: var(--text); }
.btn-add {
  background: var(--accent); border: none; color: #fff;
  border-radius: 4px; padding: 7px 15px; font-size: 13px; font-weight: 600;
  cursor: pointer; transition: background .15s;
}
.btn-add:hover { background: #6d28d9; }

/* ══ EMPTY ══ */
#empty {
  position: fixed; inset: 44px 0 0 0;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 10px; pointer-events: none;
}
#empty h1 { font-size: 22px; font-weight: 800; color: var(--text); }
#empty p { color: var(--muted); font-size: 13px; text-align: center; max-width: 260px; line-height: 1.6; }
.pbadges { display: flex; gap: 7px; margin-top: 4px; flex-wrap: wrap; justify-content: center; }
.badge { padding: 3px 10px; border-radius: 20px; font-size: 10px; font-weight: 700; }
.badge.twitch  { background: var(--twitch); color: #fff; }
.badge.kick    { background: var(--kick); color: #000; }
.badge.youtube { background: var(--youtube); color: #fff; }
.badge.tiktok  { background: var(--tiktok); color: #fff; }
</style>
</head>
<body>

<!-- TOP BAR -->
<div id="topbar">
  <span class="logo">◈ MultiStream</span>
  <div id="pill-container"></div>
  <button class="tb-btn primary" onclick="openModal()">+ Add Stream</button>
  <button class="tb-btn fav-toggle" id="fav-toggle-btn" onclick="toggleFavPanel()">⭐ Favorites</button>
  <button class="tb-btn" id="layout-btn" onclick="cycleLayout()">Layout: Auto</button>
</div>

<!-- BODY -->
<div id="body">

  <!-- FAVORITES PANEL -->
  <div id="fav-panel" class="hidden">
    <div class="fav-header"><h3>⭐ Favorites</h3></div>
    <div class="fav-list" id="fav-list"></div>
  </div>

  <!-- STREAM GRID -->
  <div id="grid"></div>
</div>

<!-- EMPTY STATE -->
<div id="empty">
  <h1>MultiStream</h1>
  <p>Watch Twitch, Kick, YouTube &amp; TikTok side by side. Add a stream to start.</p>
  <div class="pbadges">
    <span class="badge twitch">Twitch</span>
    <span class="badge kick">Kick</span>
    <span class="badge youtube">YouTube</span>
    <span class="badge tiktok">TikTok</span>
  </div>
</div>

<!-- ADD STREAM MODAL -->
<div id="modal-overlay" onclick="closeModalOutside(event)">
  <div id="modal">
    <h2>Add a Stream</h2>
    <p class="sub">Pick a platform, then type a username or paste a URL.</p>
    <div class="platform-tabs">
      <button class="ptab active" data-p="twitch"  onclick="selectPlatform('twitch')">Twitch</button>
      <button class="ptab"        data-p="kick"    onclick="selectPlatform('kick')">Kick</button>
      <button class="ptab"        data-p="youtube" onclick="selectPlatform('youtube')">YouTube</button>
      <button class="ptab"        data-p="tiktok"  onclick="selectPlatform('tiktok')">TikTok</button>
    </div>
    <div class="input-wrap">
      <input id="stream-input" type="text" placeholder="username" autocomplete="off" autocorrect="off" spellcheck="false">
      <div id="autocomplete"></div>
    </div>
    <div id="input-hint">Enter a Twitch username, e.g. ninja</div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModal()">Cancel</button>
      <button class="btn-add"    onclick="addStream()">Add</button>
    </div>
  </div>
</div>

<script>
// ══════════════════════════════════════════════
//  STATE
// ══════════════════════════════════════════════
let streams   = [];   // [{platform, id, label}]  — active on screen
let favorites = [];   // [{platform, id, label}]  — saved list
let history   = [];   // [{platform, id, label}]  — ever-added, for autocomplete
let favPanelOpen = false;
let selectedPlatform = 'twitch';
let acSelectedIdx = -1;

const PCOLORS = { twitch:'#9146ff', kick:'#53fc18', youtube:'#ff0000', tiktok:'#ff0050' };
const PLABELS = { twitch:'Twitch', kick:'Kick', youtube:'YouTube', tiktok:'TikTok' };
const HINTS   = {
  twitch:  'Enter a Twitch username, e.g. ninja',
  kick:    'Enter a Kick username, e.g. xqc',
  youtube: 'Channel handle, e.g. @mrbeast — or a YouTube video ID',
  tiktok:  'Enter a TikTok username, e.g. charlidamelio',
};

// ══════════════════════════════════════════════
//  PERSIST
// ══════════════════════════════════════════════
function save() {
  try {
    localStorage.setItem('ms_favorites', JSON.stringify(favorites));
    localStorage.setItem('ms_history',   JSON.stringify(history.slice(0, 60)));
  } catch(e) {}
}
function load() {
  try {
    favorites = JSON.parse(localStorage.getItem('ms_favorites') || '[]');
    history   = JSON.parse(localStorage.getItem('ms_history')   || '[]');
  } catch(e) { favorites = []; history = []; }
}

// ══════════════════════════════════════════════
//  EMBED URL
// ══════════════════════════════════════════════
function getEmbedUrl(platform, id) {
  const host = location.hostname || 'localhost';
  switch (platform) {
    case 'twitch':
      return `https://player.twitch.tv/?channel=${encodeURIComponent(id)}&parent=${host}&autoplay=true`;
    case 'kick':
      return `https://player.kick.com/${encodeURIComponent(id)}?autoplay=true`;
    case 'youtube': {
      let ytId = id.trim();
      let m = ytId.match(/[?&]v=([a-zA-Z0-9_-]{11})/);
      if (m) ytId = m[1];
      m = ytId.match(/youtu\.be\/([a-zA-Z0-9_-]{11})/);
      if (m) ytId = m[1];
      if (/^[a-zA-Z0-9_-]{11}$/.test(ytId))
        return `https://www.youtube.com/embed/${ytId}?autoplay=1`;
      ytId = ytId.replace(/^@/, '');
      return `https://www.youtube.com/embed/live_stream?channel=${encodeURIComponent(ytId)}&autoplay=1`;
    }
    case 'tiktok': {
      const tt = id.replace(/^@/, '');
      return `https://www.tiktok.com/live/embed?uniqueId=${encodeURIComponent(tt)}`;
    }
  }
}

// ══════════════════════════════════════════════
//  STREAM ADD / REMOVE
// ══════════════════════════════════════════════
function parseInput(raw, platform) {
  let id = raw.trim();
  // Extract from full URLs
  let m;
  if (platform === 'twitch') {
    m = id.match(/twitch\.tv\/([^/?#\s]+)/);
    if (m) id = m[1];
  } else if (platform === 'kick') {
    m = id.match(/kick\.com\/([^/?#\s]+)/);
    if (m) id = m[1];
  } else if (platform === 'youtube') {
    m = id.match(/[?&]v=([a-zA-Z0-9_-]{11})/);
    if (m) id = m[1];
    else {
      m = id.match(/youtu\.be\/([a-zA-Z0-9_-]{11})/);
      if (m) id = m[1];
    }
  } else if (platform === 'tiktok') {
    m = id.match(/tiktok\.com\/@([^/?#\s]+)/);
    if (m) id = m[1];
    id = id.replace(/^@/, '');
  }
  return id;
}

function pushHistory(entry) {
  // dedupe by platform+id
  history = history.filter(h => !(h.platform === entry.platform && h.id === entry.id));
  history.unshift(entry);
  save();
}

function addStream(platform, id, label) {
  // Called from modal OR favorites
  if (!platform) {
    const raw = document.getElementById('stream-input').value.trim();
    if (!raw) return;
    id = parseInput(raw, selectedPlatform);
    label = id;
    platform = selectedPlatform;
  }
  // Avoid duplicates on screen
  if (streams.find(s => s.platform === platform && s.id === id)) {
    closeModal(); closeAC(); return;
  }
  const entry = { platform, id, label };
  streams.push(entry);
  pushHistory(entry);
  render();
  closeModal();
  closeAC();
  document.getElementById('stream-input').value = '';
}

function removeStream(i) {
  // i may be stale if called from an old handler — find by the cell's data-key instead
  // But we also support direct index call from pill buttons
  if (typeof i === 'number') {
    streams.splice(i, 1);
  }
  render();
}

function removeStreamByKey(platform, id) {
  streams = streams.filter(s => !(s.platform === platform && s.id === id));
  render();
}

// ══════════════════════════════════════════════
//  FAVORITES
// ══════════════════════════════════════════════
function isFav(platform, id) {
  return favorites.some(f => f.platform === platform && f.id === id);
}

function toggleFav(platform, id, label) {
  if (isFav(platform, id)) {
    favorites = favorites.filter(f => !(f.platform === platform && f.id === id));
  } else {
    favorites.push({ platform, id, label });
  }
  save();
  // Patch the heart button in-place — never touch the iframe
  const cell = document.querySelector(`.stream-cell[data-key="${platform}:${id}"]`);
  if (cell) {
    const hb = cell.querySelector('.heart-btn');
    if (hb) {
      const faved = isFav(platform, id);
      hb.classList.toggle('faved', faved);
      hb.title = faved ? 'Remove from favorites' : 'Add to favorites';
      hb.textContent = faved ? '♥' : '♡';
    }
  }
  renderFavPanel();
}

function removeFav(platform, id) {
  favorites = favorites.filter(f => !(f.platform === platform && f.id === id));
  save();
  // Patch heart in-place for any live cell
  const cell = document.querySelector(`.stream-cell[data-key="${platform}:${id}"]`);
  if (cell) {
    const hb = cell.querySelector('.heart-btn');
    if (hb) { hb.classList.remove('faved'); hb.title = 'Add to favorites'; hb.textContent = '♡'; }
  }
  renderFavPanel();
}

function toggleFavPanel() {
  favPanelOpen = !favPanelOpen;
  document.getElementById('fav-panel').classList.toggle('hidden', !favPanelOpen);
  document.getElementById('fav-toggle-btn').classList.toggle('active', favPanelOpen);
}

function renderFavPanel() {
  const list = document.getElementById('fav-list');
  if (favorites.length === 0) {
    list.innerHTML = '<div class="fav-empty">Heart a stream to save it here. Click a favorite to add it to your view.</div>';
    return;
  }

  // Group by platform
  const groups = {};
  favorites.forEach(f => {
    if (!groups[f.platform]) groups[f.platform] = [];
    groups[f.platform].push(f);
  });

  let html = '';
  ['twitch','kick','youtube','tiktok'].forEach(p => {
    if (!groups[p]) return;
    html += `<div class="fav-group-label">${PLABELS[p]}</div>`;
    groups[p].forEach(f => {
      const active = streams.some(s => s.platform === f.platform && s.id === f.id);
      html += `
        <div class="fav-item" onclick="addStream('${f.platform}','${f.id}','${f.label}')">
          <div class="pdot" style="background:${PCOLORS[f.platform]}"></div>
          <span class="fav-name">${escH(f.label)}</span>
          <div class="fav-actions">
            ${active ? '<span style="font-size:10px;color:var(--accent2);padding:0 4px">▶ live</span>' : `<button class="fav-play" onclick="event.stopPropagation();addStream('${f.platform}','${f.id}','${f.label}')">▶ Watch</button>`}
            <button class="fav-del" onclick="event.stopPropagation();removeFav('${f.platform}','${f.id}')" title="Remove">✕</button>
          </div>
        </div>`;
    });
  });
  list.innerHTML = html;
}

function escH(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ══════════════════════════════════════════════
//  LAYOUT
// ══════════════════════════════════════════════
const LAYOUTS = ['auto','1','2h','2v','3','4'];
let layoutIdx = 0;
let layoutMode = 'auto';

function cycleLayout() {
  layoutIdx = (layoutIdx + 1) % LAYOUTS.length;
  layoutMode = LAYOUTS[layoutIdx];
  const labels = { auto:'Auto', '1':'1-up', '2h':'Side by Side', '2v':'Stacked', '3':'3-up', '4':'4-up' };
  document.getElementById('layout-btn').textContent = `Layout: ${labels[layoutMode]}`;
  render();
}

function getGridCSS(n) {
  if (layoutMode !== 'auto') {
    switch (layoutMode) {
      case '1':  return { cols:'1fr',            rows:'1fr' };
      case '2h': return { cols:'1fr 1fr',        rows:'1fr' };
      case '2v': return { cols:'1fr',            rows:'1fr 1fr' };
      case '3':  return { cols:'1fr 1fr',        rows:'1fr 1fr' };
      case '4':  return { cols:'1fr 1fr',        rows:'1fr 1fr' };
    }
  }
  if (n <= 1) return { cols:'1fr',               rows:'1fr' };
  if (n === 2) return { cols:'1fr 1fr',          rows:'1fr' };
  if (n === 3) return { cols:'1fr 1fr',          rows:'1fr 1fr' };
  if (n === 4) return { cols:'1fr 1fr',          rows:'1fr 1fr' };
  if (n <= 6)  return { cols:'repeat(3,1fr)',    rows:'1fr 1fr' };
  return             { cols:'repeat(3,1fr)',      rows:'repeat(3,1fr)' };
}

// ══════════════════════════════════════════════
//  RENDER
// ══════════════════════════════════════════════
function render() {
  const grid = document.getElementById('grid');
  const pillContainer = document.getElementById('pill-container');
  const empty = document.getElementById('empty');

  empty.style.display = streams.length === 0 ? 'flex' : 'none';

  // Pills in topbar
  pillContainer.innerHTML = streams.map(s => `
    <div class="stream-pill">
      <div class="pdot" style="background:${PCOLORS[s.platform]}"></div>
      <span>${escH(s.label)}</span>
      <button class="prm" onclick="removeStreamByKey('${s.platform}','${s.id}')" title="Remove">✕</button>
    </div>`).join('');

  // Grid
  const css = getGridCSS(streams.length);
  grid.style.gridTemplateColumns = css.cols;
  grid.style.gridTemplateRows    = css.rows;

  // Key cells by platform+id only.
  // CRITICAL: never move an existing cell — appendChild on a live node
  // detaches and re-attaches it which resets the iframe and blows away volume.
  // We only ever: remove stale cells, or append brand-new ones.
  const existingKeys = new Set();
  grid.querySelectorAll('.stream-cell').forEach(el => existingKeys.add(el.dataset.key));
  const newKeys = new Set(streams.map(s => `${s.platform}:${s.id}`));

  // Remove cells no longer in streams
  grid.querySelectorAll('.stream-cell').forEach(el => {
    if (!newKeys.has(el.dataset.key)) el.remove();
  });

  // Append only truly new cells — never touch existing ones
  streams.forEach(s => {
    const key = `${s.platform}:${s.id}`;
    if (existingKeys.has(key)) return; // already live in DOM, leave it alone completely

    const faved = isFav(s.platform, s.id);
    const cell = document.createElement('div');
    cell.className = 'stream-cell';
    cell.dataset.key = key;
    cell.innerHTML = `
      <div class="cell-bar">
        <div class="bar-dot" style="background:${PCOLORS[s.platform]}"></div>
        <span class="bar-name">${escH(s.label)}</span>
        <button class="cell-btn heart-btn ${faved ? 'faved' : ''}"
          title="${faved ? 'Remove from favorites' : 'Add to favorites'}"
        >${faved ? '♥' : '♡'}</button>
        <button class="cell-btn close-btn" title="Close stream">✕</button>
      </div>
      <iframe src="${getEmbedUrl(s.platform, s.id)}"
        allowfullscreen allow="autoplay; fullscreen; picture-in-picture"
        loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>`;
    cell.querySelector('.heart-btn').addEventListener('click', () => toggleFav(s.platform, s.id, s.label));
    cell.querySelector('.close-btn').addEventListener('click', () => removeStreamByKey(s.platform, s.id));
    grid.appendChild(cell);
  });

  renderFavPanel();
}

// ══════════════════════════════════════════════
//  MODAL
// ══════════════════════════════════════════════
function openModal() {
  document.getElementById('modal-overlay').classList.add('open');
  setTimeout(() => document.getElementById('stream-input').focus(), 60);
}
function closeModal() {
  document.getElementById('modal-overlay').classList.remove('open');
  closeAC();
}
function closeModalOutside(e) {
  if (e.target === document.getElementById('modal-overlay')) closeModal();
}

function selectPlatform(p) {
  selectedPlatform = p;
  document.querySelectorAll('.ptab').forEach(b => b.classList.remove('active'));
  document.querySelector(`.ptab[data-p="${p}"]`).classList.add('active');
  document.getElementById('stream-input').placeholder = p === 'youtube' ? 'username or video ID' : 'username';
  document.getElementById('input-hint').textContent = HINTS[p];
  buildAC(document.getElementById('stream-input').value);
}

// ══════════════════════════════════════════════
//  AUTOCOMPLETE
// ══════════════════════════════════════════════
function buildAC(query) {
  const ac = document.getElementById('autocomplete');
  // Combine history + favorites for suggestions, filtered by platform + query
  const pool = [...history, ...favorites].filter(
    (e, i, arr) => arr.findIndex(x => x.platform === e.platform && x.id === e.id) === i
  );

  const q = query.trim().toLowerCase();
  const matches = pool.filter(e =>
    e.platform === selectedPlatform &&
    (q === '' || e.id.toLowerCase().includes(q) || e.label.toLowerCase().includes(q))
  ).slice(0, 8);

  if (matches.length === 0) { closeAC(); return; }

  ac.innerHTML = matches.map((e, i) => `
    <div class="ac-item" data-idx="${i}" data-platform="${e.platform}" data-id="${e.id}" data-label="${escH(e.label)}"
         onmousedown="acSelect(event,${i})">
      ${escH(e.label)}
      <span class="ac-plat">${PLABELS[e.platform]}</span>
    </div>`).join('');

  acSelectedIdx = -1;
  ac.classList.add('show');
}

function closeAC() {
  document.getElementById('autocomplete').classList.remove('show');
  acSelectedIdx = -1;
}

function acSelect(e, idx) {
  e.preventDefault();
  const item = document.getElementById('autocomplete').querySelector(`[data-idx="${idx}"]`);
  if (!item) return;
  document.getElementById('stream-input').value = item.dataset.label;
  closeAC();
}

// keyboard nav in autocomplete
document.addEventListener('DOMContentLoaded', () => {
  const input = document.getElementById('stream-input');

  input.addEventListener('input', () => {
    buildAC(input.value);
  });

  input.addEventListener('keydown', e => {
    const ac = document.getElementById('autocomplete');
    const items = ac.querySelectorAll('.ac-item');
    if (!ac.classList.contains('show')) {
      if (e.key === 'Enter') { addStream(); return; }
      return;
    }
    if (e.key === 'ArrowDown') {
      e.preventDefault();
      acSelectedIdx = Math.min(acSelectedIdx + 1, items.length - 1);
      items.forEach((el, i) => el.classList.toggle('selected', i === acSelectedIdx));
    } else if (e.key === 'ArrowUp') {
      e.preventDefault();
      acSelectedIdx = Math.max(acSelectedIdx - 1, -1);
      items.forEach((el, i) => el.classList.toggle('selected', i === acSelectedIdx));
    } else if (e.key === 'Enter') {
      e.preventDefault();
      if (acSelectedIdx >= 0 && items[acSelectedIdx]) {
        input.value = items[acSelectedIdx].dataset.label;
        closeAC();
      } else {
        addStream();
      }
    } else if (e.key === 'Escape') {
      closeAC();
    }
  });

  input.addEventListener('focus', () => buildAC(input.value));
  input.addEventListener('blur',  () => setTimeout(closeAC, 150));
});

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeModal();
});

// ══════════════════════════════════════════════
//  BOOT
// ══════════════════════════════════════════════
load();
render();
</script>
